name: CI

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node scripts/computeNodeModulesCacheKey.js)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm run type-check
      - run: npm test
      - run: npm run lint
      - name: install playwright dependencies
        working-directory: ./packages/e2e
        run: npx playwright install chromium
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Run headless test
        run: npm run e2e:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Build static site
        run: node scripts/build-static.js
        env:
          PATH_PREFIX: auto
      - name: Check out memory benchmark workspace
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/checkout@v4
        with:
          repository: lvce-editor/problems-view
          ref: 9072ff883dde4b921be696578f70182ef1d8ec16
          path: benchmark-workspace/problems-view
      - name: Install memory benchmark workspace dependencies
        if: matrix.os == 'ubuntu-24.04'
        working-directory: benchmark-workspace/problems-view
        run: npm ci
      - name: Run memory benchmark
        if: matrix.os == 'ubuntu-24.04'
        run: >-
          npm run benchmark --
          --repo benchmark-workspace/problems-view
          --file packages/problems-view/src/problemsViewWorkerMain.ts
          --heap
          --memory-budget packages/benchmark/memory-budget.json
          --output benchmark-results/memory
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Upload memory benchmark summary
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-memory-summary
          path: |
            benchmark-results/memory/benchmark.json
            benchmark-results/memory/heap-summary.json
            packages/benchmark/memory-budget.json
          if-no-files-found: warn
      - name: Upload failed memory benchmark heap
        if: failure() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: eslint-memory-heap-failure
          path: benchmark-results/memory/heap.heapsnapshot
          if-no-files-found: ignore
      - name: Upload artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: ci
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
